# The pull request contract (CONTRIBUTING.md; .github/scripts/pr-semantics.sh has the rules and
# their reasons): a Conventional Commit title, Conventional Commits, and the title's release
# impact equal to the highest of the commits'. Pull requests are squash-merged, so the title is
# the commit release-please reads on main.
#
# `edited` is in the trigger on purpose: retitling a pull request runs the gate again. The job
# reads the pull request with the workflow's read-only GITHUB_TOKEN and names no stored secret,
# so a pull request from a fork runs it the same way.
name: PR semantics

on:
    pull_request:
        branches: [main]
        types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
    group: pr-semantics-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    gate:
        name: Conventional title ↔ commits
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
            pull-requests: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  sparse-checkout: .github/scripts
            - name: PR semantics gate
              env:
                  REPO: ${{ github.repository }}
                  PR_NUMBER: ${{ github.event.pull_request.number }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
                  GH_TOKEN: ${{ github.token }}
              run: bash .github/scripts/pr-semantics.sh
